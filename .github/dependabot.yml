version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      ignore:
          # ESLint 10 ecosystem isn't ready: eslint-plugin-react@7 peers
          # only ^9.7, eslint-plugin-jsx-a11y@6 peers only ^9, and
          # eslint-plugin-react-hooks@5 peers only ^9. Re-evaluate when
          # those plugins ship v10-compatible majors.
          - dependency-name: 'eslint'
            versions: ['10.x']
          - dependency-name: 'eslint-plugin-react-hooks'
            versions: ['6.x']
          - dependency-name: 'eslint-import-resolver-typescript'
            versions: ['5.x']
          # HeroUI v3 requires Tailwind v4 — gated behind that migration.
          - dependency-name: '@heroui/react'
            update-types: ['version-update:semver-major']
          - dependency-name: 'tailwindcss'
            update-types: ['version-update:semver-major']
          # React 19 is a deliberate migration — handle as its own PR.
          - dependency-name: 'react'
            update-types: ['version-update:semver-major']
          - dependency-name: 'react-dom'
            update-types: ['version-update:semver-major']
          - dependency-name: '@types/react'
            update-types: ['version-update:semver-major']
          - dependency-name: '@types/react-dom'
            update-types: ['version-update:semver-major']
          # Prisma 7 removes datasource.url from schema and moves to
          # prisma.config.ts + driver adapters — needs deliberate migration.
          - dependency-name: 'prisma'
            update-types: ['version-update:semver-major']
          - dependency-name: '@prisma/client'
            update-types: ['version-update:semver-major']
      groups:
          react-router:
              patterns:
                  - 'react-router'
                  - '@react-router/*'
          testing:
              patterns:
                  - 'vitest'
                  - '@vitest/*'
                  - '@playwright/test'
                  - '@testing-library/*'
                  - 'jsdom'
                  - 'vitest-mock-extended'
          types:
              patterns:
                  - '@types/*'
              exclude-patterns:
                  - '@types/react'
                  - '@types/react-dom'
          react:
              patterns:
                  - 'react'
                  - 'react-dom'
                  - '@types/react'
                  - '@types/react-dom'
          eslint:
              patterns:
                  - 'eslint'
                  - 'eslint-*'
                  - '@typescript-eslint/*'
          vite:
              patterns:
                  - 'vite'
                  - '@vitejs/*'
          prisma:
              patterns:
                  - 'prisma'
                  - '@prisma/*'

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
