version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      ignore:
          # Hold ESLint v8 until we migrate .eslintrc.cjs to flat config.
          # ESLint 9 made flat config the default; v10 removed legacy support.
          - dependency-name: 'eslint'
            update-types: ['version-update:semver-major']
          - dependency-name: 'eslint-plugin-react-hooks'
            update-types: ['version-update:semver-major']
          - dependency-name: 'eslint-import-resolver-typescript'
            update-types: ['version-update:semver-major']
          # HeroUI v3 requires Tailwind v4 — gated behind that migration.
          - dependency-name: '@heroui/react'
            update-types: ['version-update:semver-major']
          - dependency-name: 'tailwindcss'
            update-types: ['version-update:semver-major']
          # React 19 is a deliberate migration — handle as its own PR.
          - dependency-name: 'react'
            update-types: ['version-update:semver-major']
          - dependency-name: 'react-dom'
            update-types: ['version-update:semver-major']
          - dependency-name: '@types/react'
            update-types: ['version-update:semver-major']
          - dependency-name: '@types/react-dom'
            update-types: ['version-update:semver-major']
          # Vite 8 and @vitejs/plugin-react v6 are a linked migration —
          # plugin v6 requires Vite 8 exclusively, so they must move together.
          - dependency-name: 'vite'
            update-types: ['version-update:semver-major']
          - dependency-name: '@vitejs/plugin-react'
            update-types: ['version-update:semver-major']
          # Prisma 7 removes datasource.url from schema and moves to
          # prisma.config.ts + driver adapters — needs deliberate migration.
          - dependency-name: 'prisma'
            update-types: ['version-update:semver-major']
          - dependency-name: '@prisma/client'
            update-types: ['version-update:semver-major']
      groups:
          react-router:
              patterns:
                  - 'react-router'
                  - '@react-router/*'
          testing:
              patterns:
                  - 'vitest'
                  - '@vitest/*'
                  - '@playwright/test'
                  - '@testing-library/*'
                  - 'jsdom'
                  - 'vitest-mock-extended'
          types:
              patterns:
                  - '@types/*'
              exclude-patterns:
                  - '@types/react'
                  - '@types/react-dom'
          react:
              patterns:
                  - 'react'
                  - 'react-dom'
                  - '@types/react'
                  - '@types/react-dom'
          eslint:
              patterns:
                  - 'eslint'
                  - 'eslint-*'
                  - '@typescript-eslint/*'
          vite:
              patterns:
                  - 'vite'
                  - '@vitejs/*'
          prisma:
              patterns:
                  - 'prisma'
                  - '@prisma/*'

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
