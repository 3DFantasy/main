version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      ignore:
          # Hold ESLint v8 until we migrate .eslintrc.cjs to flat config.
          # ESLint 9 made flat config the default; v10 removed legacy support.
          - dependency-name: 'eslint'
            update-types: ['version-update:semver-major']
          - dependency-name: 'eslint-plugin-react-hooks'
            update-types: ['version-update:semver-major']
          - dependency-name: 'eslint-import-resolver-typescript'
            update-types: ['version-update:semver-major']
      groups:
          react-router:
              patterns:
                  - 'react-router'
                  - '@react-router/*'
          testing:
              patterns:
                  - 'vitest'
                  - '@vitest/*'
                  - '@playwright/test'
                  - '@testing-library/*'
                  - 'jsdom'
                  - 'vitest-mock-extended'
          types:
              patterns:
                  - '@types/*'
              exclude-patterns:
                  - '@types/react'
                  - '@types/react-dom'
          react:
              patterns:
                  - 'react'
                  - 'react-dom'
                  - '@types/react'
                  - '@types/react-dom'
          eslint:
              patterns:
                  - 'eslint'
                  - 'eslint-*'
                  - '@typescript-eslint/*'

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
