name: ci

on:
    pull_request:
    push:
        branches: [main]

# Shared, non-secret env. DB-related vars are set per-job because each job runs its own Postgres service.
# Microsoft Graph creds are intentionally omitted — getClient() in app/utils/m365/client.server.ts is
# lazy, so server boot succeeds without them. Tests that exercise sendMail mock the module instead.
env:
    SESSION_SECRET: ci-session-secret
    REDIS_HOST: localhost
    REDIS_PORT: 6379
    REDIS_QUEUE: 3df-test
    DISABLE_RESQUE: 'true'
    TEAM_1_TITLE: Team One
    TEAM_1_ABBR: T1
    TEAM_2_TITLE: Team Two
    TEAM_2_ABBR: T2
    TEAM_3_TITLE: Team Three
    TEAM_3_ABBR: T3
    TEAM_4_TITLE: Team Four
    TEAM_4_ABBR: T4
    TEAM_5_TITLE: Team Five
    TEAM_5_ABBR: T5
    TEAM_6_TITLE: Team Six
    TEAM_6_ABBR: T6
    TEAM_7_TITLE: Team Seven
    TEAM_7_ABBR: T7
    TEAM_8_TITLE: Team Eight
    TEAM_8_ABBR: T8
    TEAM_9_TITLE: Team Nine
    TEAM_9_ABBR: T9

jobs:
    unit:
        name: unit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 20
                  cache: 'npm'
            - run: npm ci
            - run: npx prisma generate
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run test:unit

    build:
        name: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 20
                  cache: 'npm'
            - run: npm ci
            - run: npx prisma generate
            - run: npm run build

    integration:
        name: integration
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: threedf_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/threedf_test

        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 20
                  cache: 'npm'
            - run: npm ci
            - run: npx prisma generate
            - run: npx prisma migrate deploy
            - run: npm run test:integration

    e2e:
        name: e2e
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: threedf_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/threedf_test

        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 20
                  cache: 'npm'
            - run: npm ci
            - run: npx prisma generate
            - run: npx prisma migrate deploy
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e

            - if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7
